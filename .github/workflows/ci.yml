name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Форматирование (ruff format)
        run: ruff format --check .
      - name: Линтер (ruff check)
        run: ruff check .
      - name: Тесты
        run: pytest -q
      - name: Утечка ячеек между сплитами (ТЗ §8, §14)
        run: python -m bsb.cli splits-check
