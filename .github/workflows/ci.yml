name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uv ставит окружение из uv.lock — те же версии, что у студентов.
      # setup-python не нужен: интерпретатор uv берёт по .python-version.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Установка
        run: uv sync --locked
      - name: Форматирование (ruff format)
        run: uv run ruff format --check .
      - name: Линтер (ruff check)
        run: uv run ruff check .
      - name: Тесты
        run: uv run pytest -q
      - name: Утечка ячеек между сплитами (ТЗ §8, §14)
        run: uv run python -m bsb.cli splits-check
