# battery-soh-bench — единственный источник правды по параметрам (ТЗ §3).
#
# Правило репозитория: любое число, влияющее на данные, разметку, фрагменты,
# сплиты или метрики, живёт ЗДЕСЬ и читается только через bsb.config.
# Захардкоженные пороги в коде адаптеров и генератора фрагментов запрещены.
#
# Ключи, помеченные "# ОТКРЫТО", соответствуют пунктам §18 ТЗ, по которым
# решение владельца ещё не зафиксировано; здесь стоит предложение из ТЗ.

version: 1

# Глобальный seed всего тулкита (ТЗ §1: тестовые фрагменты детерминированы).
seed: 20260901

paths:
  data_dir: data
  raw_dir: data/raw
  unified_dir: data/unified
  fragments_dir: data/fragments
  splits_dir: splits
  results_path: results.json

# --- §8 Сплиты -------------------------------------------------------------
splits:
  # Единица разбиения — ячейка; при наличии batch_id — партия (ТЗ §8).
  unit: cell
  files:
    train: train_cells.txt
    val: val_cells.txt
    test: test_cells.txt
  # Зафиксированные роли датасетов (ТЗ §8). Test — Sandia (SNL) целиком.
  #
  # sandia_rd — архив R&D Repository Sandia (Barkholtz et al. 2017): решением
  # владельца он взят в обучение ради химий теста. ВАЖНАЯ ОГОВОРКА по данным:
  # из 149 записей 875 опорных циклов, медиана min(SOH) = 1.000, ниже 0.95
  # опускаются 11 записей, ниже 0.8 — ни одна. То есть химии он даёт, а
  # состаренного опыта на этих химиях — почти нет (для сравнения: CALCE 0.549,
  # Oxford 0.792, тест SNL 0.845). Риск: модель выучит «кривая NCA → SOH 1.0».
  # Строка ниже обратима: убрать sandia_rd — и обучение идёт без него; сравнить
  # оба варианта на бейзлайне (§12.5, фаза 8b).
  train_datasets: [calce, oxford, sandia_rd]
  val_datasets: [calce, oxford, sandia_rd]
  test_datasets: [sandia]
  # Правило val (§8: «ячейки, не встречающиеся в train, включая по возможности
  # отдельные режимы целиком»). Тест — это перенос на NCA/NMC/LFP, состаренные
  # до 0.65, а обучение состоит из LCO (CALCE/Oxford) и почти свежего Barkholtz.
  # Ни один набор не покрывает обе оси сразу, поэтому val собирается из двух
  # частей, каждая из которых держится целиком:
  #   1) ячейки CALCE и Oxford — состаренный LCO: проверяет, что модель вообще
  #      ранжирует SOH по кривой;
  #   2) целые ФИЗИЧЕСКИЕ ЯЧЕЙКИ NCA из Barkholtz — тестовая химия: проверяет
  #      перенос по химии, но на свежих ячейках.
  # Вместе они показывают обе оси, по отдельности — ни одна из них.
  #
  # Почему ячейки, а не химия целиком: NCA входит в основную номинацию теста, и
  # если забрать в val всю химию, обучение останется без NCA вообще — тест по
  # NCA стал бы zero-shot. Здесь же в val уходят две физические ячейки (все их
  # температуры и режимы), а остальные четыре остаются в обучении.
  val_rule:
    calce_cells: [calce_CS2_33, calce_CS2_35, calce_CS2_37]
    oxford_cells: [oxford_Cell7, oxford_Cell8]
    sandia_rd_cells: [NCA_1, NCA_2]

# --- §5 Целевая переменная -------------------------------------------------
labels:
  # §5.1, РЕШЕНИЕ ВЛАДЕЛЬЦА: основной режим — только опорные циклы.
  # Тогда soh всегда measured, а интерполяция §5 п.3 не нужна вовсе.
  reference_only: true
  # Опциональный флаг §5.1 для команд, которым не хватит данных.
  # Имеет силу только если reference_only: false.
  allow_interpolated: false
  # §5 п.4: фрагменты с большим разрывом до опорного цикла отбрасываются.
  # Действует только в режиме интерполяции (при reference_only разрыв = 0).
  max_soh_gap_cycles: 60
  # §5 п.5: экстраполяция за пределы последнего опорного цикла запрещена.
  # Это не параметр настройки, а инвариант; ключ существует, чтобы его
  # нельзя было случайно включить правкой конфига.
  allow_extrapolation: false
  # §5 п.1: bol = ёмкость ЭТОЙ ячейки на первом опорном цикле.
  bol_source: first_reference_cycle
  # §5 п.2/§6: что считать опорным измерением в каждом датасете.
  # Стратегии реализуются в соответствующих адаптерах, но выбор — здесь.
  reference_cycle_rules:
    oxford:
      # Характеризация каждые 100 циклов, медленный CC C/18.5 (§17.3).
      strategy: characterization_cycle
      # Разряд характеризации — CC, а не Artemis-профиль (§6.1).
      discharge_current_tolerance_c: 0.02
      # РЕШЕНИЕ ВЛАДЕЛЬЦА: характеризация, где заряд не дошёл до верхней
      # границы, даёт заниженную разрядную ёмкость (2 случая из 519:
      # Cell2.cyc7400 и Cell5.cyc5000) и в опорные не попадает.
      require_full_charge: true
    calce:
      # У CS2 заряд одинаков во всех циклах (§5.1), поэтому опорным может быть
      # любой ПОЛНЫЙ цикл. Частичные циклы типов 4-6 и циклы со случайной
      # отсечкой (CS2_7) дают несопоставимую ёмкость и отбрасываются.
      strategy: every_full_cycle
      # Границы «полного» цикла, В (паспорт CS2: 4.2 и 2.7).
      full_charge_voltage_v: 4.15
      full_discharge_voltage_v: 2.75
      # РЕШЕНИЕ ВЛАДЕЛЬЦА: тип 3 (CS2_3, CS2_9) из бенчмарка исключается
      # целиком. У него ток разряда меняется каждый цикл (0.11, 0.22, 0.55,
      # 1.1, 1.65, 2.2 А), а ёмкость зависит от тока: 1.098 А·ч при 0.11 А
      # против 0.830 А·ч при 2.2 А. Соседние циклы скачут на 25% по режиму, а
      # не по старению, и такую ячейку нельзя чинить фильтром циклов, не сдвинув
      # bol. Это решение §18 п.5: остальные серии/типы остаются.
      exclude_cells: [CS2_3, CS2_9]
      # РЕШЕНИЕ ВЛАДЕЛЬЦА: опорный цикл обязан перенести существенный заряд, а
      # не только дойти до границ по напряжению. В конце жизни встречаются
      # циклы, которые доходят до 4.200 В и до 2.700 В, но переносят 0.119 А·ч
      # против 0.886 А·ч у нормальных (ячейка была почти полной). Их разрядная
      # ёмкость занижена в разы, и именно они давали ложные «восстановления»
      # SOH: 162 таких цикла из 862 у calce_CS2_33, все в циклах 639-866.
      min_charge_throughput_rel: 0.5
    kit:
      # Опорные измерения лежат в результатах check-up (§6.3).
      strategy: checkup_table
    sandia_rd:
      # Архив R&D Repository Sandia (Barkholtz et al. 2017) — ТОЛЬКО ОБУЧЕНИЕ,
      # другое исследование, чем SNL/Preger (скрытый тест). Нужен ради химий
      # теста: здесь есть NCA, NMC и LFP, которых нет в CALCE и Oxford (§9).
      #
      # Паспортных границ напряжения в архиве нет, а химии разные (LFP до 3.6 В
      # против 4.2 В у NCA/NMC/LCO), поэтому «полный» цикл определяется по
      # самим данным ячейки: заряд дошёл до её собственного максимума, разряд —
      # до собственного минимума.
      strategy: every_full_cycle
      voltage_tolerance_v: 0.05
      # Разные циклы в одном файле разряжаются разными токами (2.7, 5.0, 6.0 А),
      # а ёмкость зависит от тока. Опорными остаются циклы с модальным током —
      # та же логика, что заставила исключить тип 3 в CALCE.
      discharge_rate_tolerance_rel: 0.02
      # И цикл обязан перенести существенный заряд.
      min_charge_throughput_rel: 0.5
    sandia:
      # РЕШЕНИЕ ВЛАДЕЛЬЦА: опорный цикл — capacity check из §17.4: полный цикл
      # 0-100 % SOC с разрядом на 0.5C. Явного флага проверки в данных нет, но
      # он выводится механически: рабочие циклы разряжаются на 1/2/3C, проверки
      # идут на 0.5C. У ячеек с рабочим режимом 0.5-0.5C опорным становится
      # любой полный цикл, и это корректно — их рабочий режим и есть 0.5C.
      strategy: capacity_check
      # Признак проверки — равенство токов заряда и разряда: заряд у всех ячеек
      # идёт на 0.5C (§17.4), проверка разряжается на том же 0.5C, а рабочие
      # циклы — на 1/2/3C. Сравнивать с паспортным номиналом оказалось нельзя:
      # в BatteryLife номинал NMC указан то 3.0, то 2.7 А·ч, и «0.5C» от него
      # даёт 0.56C, из-за чего ячейка оставалась вообще без опорных циклов.
      reference_rate_tolerance_rel: 0.02
      # Допуск к паспортным границам напряжения ячейки (метаданные набора).
      voltage_tolerance_v: 0.05
      # РЕШЕНИЕ ВЛАДЕЛЬЦА: ячейки, циклировавшиеся в окне 20-80 % SOC, из
      # бенчмарка исключаются. В подмножестве BatteryLife у них нет ни одного
      # полного 0-100 % цикла (проверено: размах 2.700-3.980 В при границах
      # 2.5-4.2 В), поэтому capacity check определить нечем, а ёмкость окна
      # 20-80 — это другая величина, а не SOH полной ячейки. Отсеиваются по
      # имени файла, без чтения данных.
      exclude_soc_windows: ["20-80"]
      # РЕШЕНИЕ ВЛАДЕЛЬЦА (то же правило, что для CALCE): capacity check обязан
      # перенести существенный заряд. У sandia_...NCA_25C_0.5-0.5C_b последний
      # check доходит до 4.2 В и до 2.5 В, но переносит 0.004 А·ч зарядом и
      # 0.064 А·ч разрядом (ячейка на пределе, запись оборвана) — из-за него
      # кривая падала до SOH 0.02.
      min_charge_throughput_rel: 0.5

# --- §4.4 Разметка шагов ---------------------------------------------------
# РЕШЕНО: пороги вынесены в конфиг, а не зашиты (на KIT с разрешением 2 с
# они почти наверняка потребуют правки).
step_labeling:
  # chg_cc: ток > 0 и стабилен в пределах ±2% от медианы шага.
  cc_current_tolerance_rel: 0.02
  # chg_cv: напряжение стабильно в пределах ±5 мВ, ток падает.
  cv_voltage_tolerance_v: 0.005
  # Минимальная длина шага в точках, иначе шаг не выделяется.
  min_step_points: 5
  # Порог «ток ≈ 0» для шага rest, А.
  rest_current_tolerance_a: 0.05
  # Порог различения знака тока, А (защита от шума около нуля).
  current_sign_tolerance_a: 0.01

# --- §7 Генератор фрагментов ----------------------------------------------
fragment:
  # Ширина окна по напряжению, В.
  delta_v: 0.2
  # Точек после ресемплинга.
  n_points: 128
  # Только CC-фаза заряда (§7 п.1).
  phase: chg_cc
  # §9: per_cell_range, иначе на LFP окна не существуют физически.
  v_normalization: per_cell_range
  channels: [q_norm, current, temperature]
  # Что делать с каналом температуры там, где её нет в логах:
  #   setpoint — подставить уставку камеры (temperature_setpoint_c). Так нужен
  #     CALCE: у него температуры в логах нет вовсе (§6.2), а испытания шли при
  #     комнатной температуре, то есть уставка и есть измеряемая величина. Тот
  #     же путь покрывает 161 опорный цикл SNL (2.2 %), где канал не записан;
  #   drop — цикл без температуры в фрагменты не попадает (потеря ~2.2 % на SNL
  #     и всех фрагментов CALCE).
  temperature_fill: setpoint
  # Иначе фрагмент отбрасывается.
  min_points_in_window: 20
  # Детерминированный seed генератора фрагментов (§1, §7).
  seed: 20260901
  # Сколько окон на цикл в режиме fixed.
  windows_per_cycle: 1
  # §10, ОТКРЫТО: сетка delta_v для номинации «экономность».
  delta_v_grid: [0.05, 0.1, 0.15, 0.2]
  # Границы окна в вольтах для v_normalization=absolute (диапазон Li-ion).
  # При per_cell_range ключ не используется: диапазон берётся у самой ячейки,
  # поэтому окна существуют и на LFP (§9). При absolute на LFP окон не будет
  # вовсе — это и есть предсказание §9, а не ошибка.
  absolute_bounds: [3.0, 4.25]

# --- §6.3 KIT: потоковый разбор -------------------------------------------
ingest:
  kit:
    # ОТКРЫТО (§18 п.6): прореживание до 10 с.
    target_resolution_s: 10.0
    # Внутри CC-фазы заряда исходное разрешение сохраняется (§6.3).
    keep_cc_full_resolution: true
    # ОТКРЫТО (§18 п.7): календарное старение — фильтруем, задача
    # про циклическую деградацию.
    include_calendar_aging: false
  calce:
    # ОТКРЫТО (§18 п.5): пока только CS2.
    series: [CS2]
  oxford:
    # §17.3: у каждой характеризации четыре подшага — C1ch/C1dc (1C) и
    # OCVch/OCVdc (псевдо-OCV, 40 мА = C/18.5). Во фрагменты идёт OCVch:
    # именно его имеет в виду §17.3, когда говорит «все фрагменты Oxford
    # будут с C/18.5». Смена на C1ch — правка одной строки.
    charge_step: OCVch
    # Разрядная ёмкость для SOH: медленный полный разряд (§5 п.2).
    discharge_step: OCVdc
    # Перезапуск тестера оставляет внутри шага два склеенных сегмента
    # (в Cell1 — cyc3200 и cyc4500). Разрыв больше порога делит шаг, и
    # остаётся последний сегмент. Порог в секундах.
    max_step_gap_s: 60.0
  sandia: {}

# --- §10 Метрики -----------------------------------------------------------
eval:
  # §9: основной тест — только NCA и NMC.
  main_test_chemistries: [NCA, NMC]
  # §9: LFP — бонусная номинация, считается тем же eval.py с --hard-mode.
  hard_mode_chemistries: [LFP]
  # Номинация «калибровка»: номинальное покрытие интервала.
  calibration_coverage: 0.90
  # Разбивка по децилям SOH.
  soh_deciles: 10
  # Допустимый диапазон предсказания (§11).
  prediction_bounds: [0.0, 1.2]

# --- §12.3 Проба на утечку -------------------------------------------------
leakage_probe:
  # ОТКРЫТО (§18 п.10): проба не должна быть лучше «пола» более чем на 15%.
  # Порог относительного улучшения MAE пробы над константой.
  max_relative_improvement: 0.15

# --- §12.4 Шумовой пол -----------------------------------------------------
noise_floor:
  # Минимум ячеек-реплик на условие.
  min_replicates: 2
  # Ключи условия, по которым группируются реплики.
  replicate_keys: [chemistry, temperature_setpoint_c]

# --- §12.5 Бейзлайн --------------------------------------------------------
baseline:
  model: elastic_net
  savgol:
    window_length: 11
    polyorder: 3
  elastic_net:
    alpha: 0.01
    l1_ratio: 0.5
    max_iter: 5000
