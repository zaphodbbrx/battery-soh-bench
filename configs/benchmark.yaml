# Публичные настройки валидации и подсчёта результатов контеста.
seed: 42
paths:
  fragments_dir: data/fragments
  results_path: results.json
eval:
  main_test_chemistries: [NCA, NMC]
  hard_mode_chemistries: [LFP]
  calibration_coverage: 0.90
  soh_deciles: 10
  prediction_bounds: [0.0, 1.2]
baseline:
  model: elastic_net
  savgol_window_length: 11
  savgol_polyorder: 3
  elastic_net_alpha: 0.01
  elastic_net_l1_ratio: 0.5
  elastic_net_max_iter: 5000
