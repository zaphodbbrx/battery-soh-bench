# battery-soh-bench — единственный источник правды по параметрам (ТЗ §3).
#
# Правило репозитория: любое число, влияющее на данные, разметку, фрагменты,
# сплиты или метрики, живёт ЗДЕСЬ и читается только через bsb.config.
# Захардкоженные пороги в коде адаптеров и генератора фрагментов запрещены.
#
# Ключи, помеченные "# ОТКРЫТО", соответствуют пунктам §18 ТЗ, по которым
# решение владельца ещё не зафиксировано; здесь стоит предложение из ТЗ.

version: 1

# Глобальный seed всего тулкита (ТЗ §1: тестовые фрагменты детерминированы).
seed: 20260901

paths:
  data_dir: data
  raw_dir: data/raw
  unified_dir: data/unified
  fragments_dir: data/fragments
  splits_dir: splits
  results_path: results.json

# --- §8 Сплиты -------------------------------------------------------------
splits:
  # Единица разбиения — ячейка; при наличии batch_id — партия (ТЗ §8).
  unit: cell
  files:
    train: train_cells.txt
    val: val_cells.txt
    test: test_cells.txt
  # Зафиксированные роли датасетов (ТЗ §8). Test — Sandia целиком.
  train_datasets: [calce, kit, oxford]
  val_datasets: [calce, kit, oxford]
  test_datasets: [sandia]

# --- §5 Целевая переменная -------------------------------------------------
labels:
  # §5.1, РЕШЕНИЕ ВЛАДЕЛЬЦА: основной режим — только опорные циклы.
  # Тогда soh всегда measured, а интерполяция §5 п.3 не нужна вовсе.
  reference_only: true
  # Опциональный флаг §5.1 для команд, которым не хватит данных.
  # Имеет силу только если reference_only: false.
  allow_interpolated: false
  # §5 п.4: фрагменты с большим разрывом до опорного цикла отбрасываются.
  # Действует только в режиме интерполяции (при reference_only разрыв = 0).
  max_soh_gap_cycles: 60
  # §5 п.5: экстраполяция за пределы последнего опорного цикла запрещена.
  # Это не параметр настройки, а инвариант; ключ существует, чтобы его
  # нельзя было случайно включить правкой конфига.
  allow_extrapolation: false
  # §5 п.1: bol = ёмкость ЭТОЙ ячейки на первом опорном цикле.
  bol_source: first_reference_cycle
  # §5 п.2/§6: что считать опорным измерением в каждом датасете.
  # Стратегии реализуются в соответствующих адаптерах, но выбор — здесь.
  reference_cycle_rules:
    oxford:
      # Характеризация каждые 100 циклов, медленный CC C/18.5 (§17.3).
      strategy: characterization_cycle
      # Разряд характеризации — CC, а не Artemis-профиль (§6.1).
      discharge_current_tolerance_c: 0.02
      # РЕШЕНИЕ ВЛАДЕЛЬЦА: характеризация, где заряд не дошёл до верхней
      # границы, даёт заниженную разрядную ёмкость (2 случая из 519:
      # Cell2.cyc7400 и Cell5.cyc5000) и в опорные не попадает.
      require_full_charge: true
    calce:
      # У CS2 заряд одинаков во всех циклах (§5.1) — опорным может быть
      # любой полный цикл; берём измеренную разрядную ёмкость как есть.
      strategy: every_full_cycle
    kit:
      # Опорные измерения лежат в результатах check-up (§6.3).
      strategy: checkup_table
    sandia:
      # capacity check: три цикла 0-100% SOC на 0.5C (§17.4).
      strategy: capacity_check
      # Окно поиска capacity check внутри раунда циклирования.
      max_cycles_since_check: 3

# --- §4.4 Разметка шагов ---------------------------------------------------
# РЕШЕНО: пороги вынесены в конфиг, а не зашиты (на KIT с разрешением 2 с
# они почти наверняка потребуют правки).
step_labeling:
  # chg_cc: ток > 0 и стабилен в пределах ±2% от медианы шага.
  cc_current_tolerance_rel: 0.02
  # chg_cv: напряжение стабильно в пределах ±5 мВ, ток падает.
  cv_voltage_tolerance_v: 0.005
  # Минимальная длина шага в точках, иначе шаг не выделяется.
  min_step_points: 5
  # Порог «ток ≈ 0» для шага rest, А.
  rest_current_tolerance_a: 0.05
  # Порог различения знака тока, А (защита от шума около нуля).
  current_sign_tolerance_a: 0.01

# --- §7 Генератор фрагментов ----------------------------------------------
fragment:
  # Ширина окна по напряжению, В.
  delta_v: 0.2
  # Точек после ресемплинга.
  n_points: 128
  # Только CC-фаза заряда (§7 п.1).
  phase: chg_cc
  # §9: per_cell_range, иначе на LFP окна не существуют физически.
  v_normalization: per_cell_range
  channels: [q_norm, current, temperature]
  # Иначе фрагмент отбрасывается.
  min_points_in_window: 20
  # Детерминированный seed генератора фрагментов (§1, §7).
  seed: 20260901
  # Сколько окон на цикл в режиме fixed.
  windows_per_cycle: 1
  # §10, ОТКРЫТО: сетка delta_v для номинации «экономность».
  delta_v_grid: [0.05, 0.1, 0.15, 0.2]
  # Границы окна в вольтах для v_normalization=absolute (диапазон Li-ion).
  # При per_cell_range ключ не используется: диапазон берётся у самой ячейки,
  # поэтому окна существуют и на LFP (§9). При absolute на LFP окон не будет
  # вовсе — это и есть предсказание §9, а не ошибка.
  absolute_bounds: [3.0, 4.25]

# --- §6.3 KIT: потоковый разбор -------------------------------------------
ingest:
  kit:
    # ОТКРЫТО (§18 п.6): прореживание до 10 с.
    target_resolution_s: 10.0
    # Внутри CC-фазы заряда исходное разрешение сохраняется (§6.3).
    keep_cc_full_resolution: true
    # ОТКРЫТО (§18 п.7): календарное старение — фильтруем, задача
    # про циклическую деградацию.
    include_calendar_aging: false
  calce:
    # ОТКРЫТО (§18 п.5): пока только CS2.
    series: [CS2]
  oxford:
    # §17.3: у каждой характеризации четыре подшага — C1ch/C1dc (1C) и
    # OCVch/OCVdc (псевдо-OCV, 40 мА = C/18.5). Во фрагменты идёт OCVch:
    # именно его имеет в виду §17.3, когда говорит «все фрагменты Oxford
    # будут с C/18.5». Смена на C1ch — правка одной строки.
    charge_step: OCVch
    # Разрядная ёмкость для SOH: медленный полный разряд (§5 п.2).
    discharge_step: OCVdc
    # Перезапуск тестера оставляет внутри шага два склеенных сегмента
    # (в Cell1 — cyc3200 и cyc4500). Разрыв больше порога делит шаг, и
    # остаётся последний сегмент. Порог в секундах.
    max_step_gap_s: 60.0
  sandia: {}

# --- §10 Метрики -----------------------------------------------------------
eval:
  # §9: основной тест — только NCA и NMC.
  main_test_chemistries: [NCA, NMC]
  # §9: LFP — бонусная номинация, считается тем же eval.py с --hard-mode.
  hard_mode_chemistries: [LFP]
  # Номинация «калибровка»: номинальное покрытие интервала.
  calibration_coverage: 0.90
  # Разбивка по децилям SOH.
  soh_deciles: 10
  # Допустимый диапазон предсказания (§11).
  prediction_bounds: [0.0, 1.2]

# --- §12.3 Проба на утечку -------------------------------------------------
leakage_probe:
  # ОТКРЫТО (§18 п.10): проба не должна быть лучше «пола» более чем на 15%.
  # Порог относительного улучшения MAE пробы над константой.
  max_relative_improvement: 0.15

# --- §12.4 Шумовой пол -----------------------------------------------------
noise_floor:
  # Минимум ячеек-реплик на условие.
  min_replicates: 2
  # Ключи условия, по которым группируются реплики.
  replicate_keys: [chemistry, temperature_setpoint_c]

# --- §12.5 Бейзлайн --------------------------------------------------------
baseline:
  model: elastic_net
  savgol:
    window_length: 11
    polyorder: 3
  elastic_net:
    alpha: 0.01
    l1_ratio: 0.5
    max_iter: 5000
